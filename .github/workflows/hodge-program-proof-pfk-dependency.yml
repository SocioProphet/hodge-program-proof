name: hodge-program-proof PFK Dependency Validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  validate-pfk-dependency:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout hodge-program-proof
        uses: actions/checkout@v4
        with:
          path: hodge-program-proof

      - name: Checkout Heller-Godel at pinned commit
        uses: actions/checkout@v4
        with:
          repository: SocioProphet/Heller-Godel
          ref: 2ea5f5162bcc8421840df4b33a51580e2732f391
          path: Heller-Godel

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate canonical PFK dependency
        env:
          HELLER_GODEL_ROOT: ${{ github.workspace }}/Heller-Godel
        run: |
          cd hodge-program-proof
          python -m unittest tests/test_pfk_dependency.py -v
