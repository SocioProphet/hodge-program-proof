name: validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  claim-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check Hodge anti-seed and claim boundary
        run: python scripts/check_claim_boundary.py
      - name: Check Hodge structure and negative paths
        run: python scripts/check_hodge_structure.py
